<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cypress-timeline milestone presentation">
<title>Cypress-timeline</title>
<style>
:root{color-scheme:dark;--surface:#10212a;--text:#f5f0e7;--muted:#b4c5ca;--accent:#75d6b1;--line:#35505a}*{box-sizing:border-box}body{margin:0;background:#09171e;color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,select{color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}main{max-width:1440px;margin:auto;padding:30px 34px 20px;background:var(--surface);min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}h1{font-size:clamp(22px,3vw,35px);font-weight:600;margin:0 0 8px;overflow-wrap:anywhere}header p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.week{color:var(--accent);font-size:clamp(24px,3vw,40px);white-space:nowrap;font-variant-numeric:tabular-nums}.picture{position:relative;aspect-ratio:1800/640;overflow:hidden;background:#20333d;isolation:isolate}.picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;z-index:0;transition:opacity .8s ease;pointer-events:none}.picture img.current{opacity:1;z-index:2}.picture img.outgoing{opacity:1;z-index:1}.picture img.current.moving{animation:drift 120s linear both}.paused .picture img{animation-play-state:paused!important}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.04)}}.badge{position:absolute;top:12px;left:14px;z-index:4;background:#10212ac9;padding:7px 10px;font-size:12px;max-width:90%;line-height:1.5}.summary{min-height:140px;padding:22px 0 16px}.summary-line{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.summary h2{font-size:28px;margin:0;font-weight:600}.label{color:var(--accent);font-size:18px}.summary p{margin:12px 0 0;line-height:1.7;font-size:15px;overflow-wrap:anywhere}.nodes{display:grid;grid-template-columns:repeat(var(--count),minmax(105px,1fr));gap:8px;overflow:auto;padding:8px 2px 14px}.node{border:0;background:transparent;color:var(--muted);padding:10px 5px;border-radius:5px;text-align:center}.node i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line);margin:0 auto 10px}.node.done i{background:var(--accent)}.node[aria-current=true]{color:var(--text);background:#75d6b111}.node[aria-current=true] i{box-shadow:0 0 0 5px #75d6b12b}.node span,.node small{display:block}.node span{font-size:13px}.node small{font-size:11px;margin-top:6px;font-variant-numeric:tabular-nums}.controls{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:15px}.controls button,.controls select{background:#20343f;border:1px solid #3d5661;border-radius:6px;padding:9px 12px;min-height:40px}.controls .primary{background:var(--accent);color:#09241c;border-color:var(--accent);font-weight:600;min-width:75px}.seek{flex:1;min-width:40px;accent-color:var(--accent)}.clock{font-size:12px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}.foot{font-size:12px;line-height:1.7;color:var(--muted);margin:16px 0 0}.sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}main:fullscreen{max-width:none;height:100%;overflow:auto;display:flex;flex-direction:column;justify-content:center;padding:3vh 5vw}@media(max-width:700px){main{padding:18px 15px}header{align-items:flex-start}header p{font-size:12px}.picture{aspect-ratio:1.8}.badge{font-size:10px;padding:5px 7px}.summary{min-height:155px}.summary h2{font-size:24px}.label{font-size:15px}.summary p{font-size:13px}.nodes{grid-template-columns:repeat(4,1fr);overflow:visible}.node span{font-size:12px}.controls{flex-wrap:wrap;gap:7px}.controls button,.controls select{padding:8px}.seek{order:5;flex-basis:70%}.clock{order:6}.foot{font-size:11px}}@media(prefers-reduced-motion:reduce){.picture img{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="report" aria-label="项目里程碑演示">
<header><div><h1 id="heading">Cypress-timeline</h1><p id="subtitle"></p></div><div class="week" id="week"></div></header>
<div class="picture" id="picture"><div class="badge" id="badge"></div></div>
<section class="summary" aria-live="polite" aria-atomic="true"><div class="summary-line"><h2 id="title"></h2><span class="label" id="label"></span></div><p id="description"></p></section>
<nav class="nodes" id="nodes" aria-label="选择里程碑"></nav>
<div class="controls"><button id="prev" aria-label="上一节点">上一节点</button><button class="primary" id="play">播放</button><button id="next" aria-label="下一节点">下一节点</button><label class="sr" for="seek">演示播放位置</label><input class="seek" id="seek" type="range" min="0" step="0.05" value="0"><span class="clock" id="clock"></span><label class="sr" for="speed">播放速度</label><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="fullscreen">全屏</button></div>
<p class="foot" id="disclosure"></p><noscript>此演示需要 JavaScript 才能播放时间线。</noscript>
</main>
<script>
'use strict';
const timeline=__TIMELINE_DATA__;
const byId=id=>document.getElementById(id),root=byId('report');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let elapsed=0,playing=false,speed=1,lastStamp=null,current=-1,resumeOnVisible=false;
byId('heading').textContent=timeline.title;document.title=timeline.title+' · Cypress-timeline';byId('subtitle').textContent=timeline.subtitle;byId('disclosure').textContent=timeline.disclosure;byId('badge').textContent='Cypress-timeline';byId('seek').max=timeline.duration;byId('nodes').style.setProperty('--count',timeline.stages.length);
const images=timeline.stages.map(stage=>{const image=new Image();image.src=stage.image;image.alt=stage.title+'，'+stage.label;image.style.objectFit=timeline.image_fit;image.decoding='sync';byId('picture').append(image);return image});
const buttons=timeline.stages.map((stage,index)=>{const b=document.createElement('button');b.className='node';const dot=document.createElement('i');dot.setAttribute('aria-hidden','true');const title=document.createElement('span');title.textContent=stage.title;const week=document.createElement('small');week.textContent='W'+stage.week;b.append(dot,title,week);b.setAttribute('aria-label',stage.title+'，'+stage.label);b.onclick=()=>jump(index);byId('nodes').append(b);return b});
function clock(seconds){const n=Math.floor(seconds);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function setPlaying(value){playing=value;lastStamp=null;byId('play').textContent=playing?'暂停':elapsed>=timeline.duration?'重播':'播放';root.classList.toggle('paused',!playing)}
function update(){let index=timeline.stages.length-1;for(let i=0;i<timeline.stages.length;i++){if(elapsed<timeline.stages[i].start+timeline.stages[i].seconds){index=i;break}}if(index!==current){const previous=current;current=index;images.forEach((image,i)=>{image.classList.toggle('outgoing',i===previous);image.classList.toggle('current',i===index);image.classList.remove('moving');image.setAttribute('aria-hidden',String(i!==index))});const stage=timeline.stages[index];if(!reduced){void images[index].offsetWidth;images[index].style.animationDuration=stage.seconds+'s';images[index].classList.add('moving')}byId('title').textContent=stage.title;byId('label').textContent=stage.label;byId('description').textContent=stage.description;byId('week').textContent='W'+stage.week;buttons.forEach((b,i)=>{b.classList.toggle('done',i<=index);b.setAttribute('aria-current',String(i===index))})}byId('play').textContent=playing?'暂停':elapsed>=timeline.duration?'重播':'播放';byId('seek').value=elapsed;byId('clock').textContent=clock(elapsed)+' / '+clock(timeline.duration);byId('prev').disabled=index===0;byId('next').disabled=index===timeline.stages.length-1}
function jump(index){const i=Math.max(0,Math.min(timeline.stages.length-1,index));elapsed=timeline.stages[i].start;lastStamp=null;update()}
byId('play').onclick=()=>{if(elapsed>=timeline.duration)elapsed=0;setPlaying(!playing);update()};byId('prev').onclick=()=>jump(current-1);byId('next').onclick=()=>jump(current+1);byId('seek').oninput=event=>{elapsed=Number(event.target.value);lastStamp=null;if(elapsed>=timeline.duration)setPlaying(false);update()};byId('speed').onchange=event=>{speed=Number(event.target.value);lastStamp=null};byId('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(root.requestFullscreen)await root.requestFullscreen();else byId('fullscreen').textContent='全屏不可用'}catch{byId('fullscreen').textContent='全屏不可用'}};document.addEventListener('fullscreenchange',()=>{byId('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});document.addEventListener('keydown',event=>{if(/INPUT|SELECT|BUTTON|TEXTAREA/.test(event.target.tagName))return;if(event.code==='Space'){event.preventDefault();byId('play').click()}else if(event.code==='ArrowRight'){event.preventDefault();jump(current+1)}else if(event.code==='ArrowLeft'){event.preventDefault();jump(current-1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden){resumeOnVisible=playing;setPlaying(false)}else if(resumeOnVisible){resumeOnVisible=false;setPlaying(true)}});
function tick(stamp){if(playing){if(lastStamp!==null)elapsed=Math.min(timeline.duration,elapsed+(stamp-lastStamp)/1000*speed);lastStamp=stamp;if(elapsed>=timeline.duration)setPlaying(false);update()}requestAnimationFrame(tick)}
setPlaying(false);update();Promise.all(images.map(image=>image.decode().catch(()=>{throw new Error('Timeline image could not be decoded')}))).then(()=>{if(!reduced&&!document.hidden)setPlaying(true)}).catch(()=>{byId('description').textContent='图片加载失败，请检查原始素材后重新导出。';setPlaying(false)});requestAnimationFrame(tick);
</script>
</body></html>
